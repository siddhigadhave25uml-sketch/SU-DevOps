{% extends "base.html" %}{% block title %}Borrowers{% endblock %}{% block content %}<h2>Borrowers</h2>
<form method="post" class="form-grid"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><button>Register borrower</button></form>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Registered</th></tr></thead><tbody>{% for b in borrowers %}<tr><td>{{ b.name }}</td><td>{{ b.email }}</td><td>{{ b.created_at }}</td></tr>{% else %}<tr><td colspan="3">No borrowers yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
