{% extends "base.html" %}{% block title %}Books{% endblock %}{% block content %}<h2>Book Catalogue</h2>
<form method="post" class="form-grid"><label>Title<input name="title" required></label><label>Author<input name="author" required></label><label>ISBN<input name="isbn" required></label><label>Total copies<input name="copies" type="number" min="1" value="1" required></label><button>Add book</button></form>
<div class="table-wrap"><table><thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Available</th><th>Total</th></tr></thead><tbody>{% for b in books %}<tr><td>{{ b.title }}</td><td>{{ b.author }}</td><td>{{ b.isbn }}</td><td>{{ b.available_copies }}</td><td>{{ b.total_copies }}</td></tr>{% else %}<tr><td colspan="5">No books yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
