{% extends 'base.html' %}{% block title %}Students{% endblock %}{% block content %}<h2>Students</h2><form method="post" class="form-grid"><label>Full name *<input name="name" required></label><label>Email<input name="email" type="email"></label><label>Department<input name="department"></label><label>Year<input name="year" placeholder="e.g. Second Year"></label><button>Add student</button></form><h3>Student records</h3><table><tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th><th>Action</th></tr>{% for s in students %}<tr><td>{{ s.id }}</td><td>{{ s.name }}</td><td>{{ s.email }}</td><td>{{ s.department }}</td><td>{{ s.year }}</td><td><form method="post" action="{{ url_for('delete_student', student_id=s.id) }}" onsubmit="return confirm('Delete this student and their attendance/marks?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="6">No students found.</td></tr>{% endfor %}</table>{% endblock %}
