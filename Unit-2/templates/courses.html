{% extends 'base.html' %}{% block title %}Courses{% endblock %}{% block content %}<h2>Courses</h2><form method="post" class="form-grid"><label>Course name *<input name="name" required></label><label>Course code *<input name="code" required placeholder="e.g. CS101"></label><button>Add course</button></form><h3>Course list</h3><table><tr><th>ID</th><th>Course code</th><th>Course name</th></tr>{% for c in courses %}<tr><td>{{ c.id }}</td><td>{{ c.code }}</td><td>{{ c.name }}</td></tr>{% else %}<tr><td colspan="3">No courses found.</td></tr>{% endfor %}</table>{% endblock %}
