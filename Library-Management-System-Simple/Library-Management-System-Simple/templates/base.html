<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Library Management System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header><a href="{{ url_for('home') }}">📚 Library Management</a><nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('books') }}">Books</a><a href="{{ url_for('add_book') }}">Add book</a></nav></header>
<main>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer>Library Management System · Flask + MySQL · DevOps sample</footer>
</body></html>
